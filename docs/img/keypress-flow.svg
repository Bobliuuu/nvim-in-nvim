<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14"><title>Life of one keypress</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bb9af7"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0af68"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dcfff"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7982a9"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#1a1b26"/>
<text x="490" y="32" fill="#c0caf5" font-size="15" text-anchor="middle" font-weight="700">Life of a keypress: `d` `w` composed, not hardcoded</text>
<rect x="20" y="60" width="176" height="112" rx="9" fill="#24283b" stroke="#7dcfff" stroke-width="1.6"/>
<text x="34" y="84" fill="#7dcfff" font-weight="700" font-size="14.5">1  terminal</text>
<text x="34" y="106" fill="#c0caf5" font-size="13">sends &quot;d&quot;</text>
<rect x="212" y="60" width="176" height="112" rx="9" fill="#24283b" stroke="#f7768e" stroke-width="1.6"/>
<text x="226" y="84" fill="#f7768e" font-weight="700" font-size="14.5">2  vim.on_key</text>
<text x="226" y="106" fill="#c0caf5" font-size="13">returns &quot;&quot; →</text>
<text x="226" y="125" fill="#c0caf5" font-size="13">native d never runs</text>
<line x1="192" y1="116" x2="212" y2="116" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="404" y="60" width="176" height="112" rx="9" fill="#24283b" stroke="#e0af68" stroke-width="1.6"/>
<text x="418" y="84" fill="#e0af68" font-weight="700" font-size="14.5">3  input.lua</text>
<text x="418" y="106" fill="#c0caf5" font-size="13">normalise key,</text>
<text x="418" y="125" fill="#c0caf5" font-size="13">route to focused</text>
<text x="418" y="144" fill="#c0caf5" font-size="13">editor</text>
<line x1="384" y1="116" x2="404" y2="116" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="596" y="60" width="176" height="112" rx="9" fill="#24283b" stroke="#bb9af7" stroke-width="1.6"/>
<text x="610" y="84" fill="#bb9af7" font-weight="700" font-size="14.5">4  mapping layer</text>
<text x="610" y="106" fill="#c0caf5" font-size="13">per-editor maps,</text>
<text x="610" y="125" fill="#c0caf5" font-size="13">prefix wait / timeout</text>
<line x1="576" y1="116" x2="596" y2="116" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="788" y="60" width="176" height="112" rx="9" fill="#24283b" stroke="#7aa2f7" stroke-width="1.6"/>
<text x="802" y="84" fill="#7aa2f7" font-weight="700" font-size="14.5">5  modes.lua</text>
<text x="802" y="106" fill="#c0caf5" font-size="13">state = {op = d}</text>
<text x="802" y="125" fill="#c0caf5" font-size="13">waiting for motion</text>
<line x1="768" y1="116" x2="788" y2="116" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<text x="490" y="205" fill="#7982a9" font-size="13" text-anchor="middle" font-weight="400">…then the user presses `w`:</text>
<rect x="20" y="228" width="176" height="112" rx="9" fill="#24283b" stroke="#9ece6a" stroke-width="1.6"/>
<text x="34" y="252" fill="#9ece6a" font-weight="700" font-size="14.5">6  motions.w</text>
<text x="34" y="274" fill="#c0caf5" font-size="13">ctx, row, col, count</text>
<text x="34" y="293" fill="#c0caf5" font-size="13">→ target (r, c)</text>
<text x="34" y="312" fill="#c0caf5" font-size="13">kind = exclusive</text>
<rect x="212" y="228" width="176" height="112" rx="9" fill="#24283b" stroke="#7aa2f7" stroke-width="1.6"/>
<text x="226" y="252" fill="#7aa2f7" font-weight="700" font-size="14.5">7  range</text>
<text x="226" y="274" fill="#c0caf5" font-size="13">start..target</text>
<text x="226" y="293" fill="#c0caf5" font-size="13">becomes a RANGE</text>
<text x="226" y="312" fill="#c0caf5" font-size="13">{sr,sc,er,ec}</text>
<line x1="192" y1="284" x2="212" y2="284" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="404" y="228" width="176" height="112" rx="9" fill="#24283b" stroke="#e0af68" stroke-width="1.6"/>
<text x="418" y="252" fill="#e0af68" font-weight="700" font-size="14.5">8  operators.d</text>
<text x="418" y="274" fill="#c0caf5" font-size="13">yank range into</text>
<text x="418" y="293" fill="#c0caf5" font-size="13">registers, then delete</text>
<line x1="384" y1="284" x2="404" y2="284" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="596" y="228" width="176" height="112" rx="9" fill="#24283b" stroke="#bb9af7" stroke-width="1.6"/>
<text x="610" y="252" fill="#bb9af7" font-weight="700" font-size="14.5">9  Editor:replace</text>
<text x="610" y="274" fill="#c0caf5" font-size="13">undo checkpoint,</text>
<text x="610" y="293" fill="#c0caf5" font-size="13">Buf:set_text(editor,…)</text>
<text x="610" y="312" fill="#c0caf5" font-size="13">owner check</text>
<line x1="576" y1="284" x2="596" y2="284" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="788" y="228" width="176" height="112" rx="9" fill="#24283b" stroke="#7dcfff" stroke-width="1.6"/>
<text x="802" y="252" fill="#7dcfff" font-weight="700" font-size="14.5">10 render</text>
<text x="802" y="274" fill="#c0caf5" font-size="13">cursor · winbar ·</text>
<text x="802" y="293" fill="#c0caf5" font-size="13">footer · selection</text>
<line x1="768" y1="284" x2="788" y2="284" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<text x="490" y="376" fill="#c0caf5" font-size="13" text-anchor="middle" font-weight="400">`d` knows nothing about `w`. `dw`, `d$`, `d2w`, `cw`, `yj`, `dG` all come from one operator × one motion.</text>
<text x="490" y="400" fill="#7982a9" font-size="12.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">x = dl · D = d$ · C = c$ · s = cl · S = cc · Y = yy  (key expansions, not special cases)</text>
</svg>
