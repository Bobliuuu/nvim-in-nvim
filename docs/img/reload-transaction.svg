<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14"><title>Config reload transaction</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bb9af7"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0af68"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dcfff"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7982a9"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#1a1b26"/>
<text x="490" y="30" fill="#c0caf5" font-size="15" text-anchor="middle" font-weight="700">Config reload is a transaction</text>
<rect x="20" y="56" width="200" height="90" rx="9" fill="#24283b" stroke="#7aa2f7" stroke-width="1.6"/>
<text x="34" y="80" fill="#7aa2f7" font-weight="700" font-size="14.5">editor:reload_config()</text>
<text x="34" y="102" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">read configs/c/init.lua</text>
<rect x="260" y="56" width="220" height="90" rx="9" fill="#24283b" stroke="#bb9af7" stroke-width="1.6"/>
<text x="274" y="80" fill="#bb9af7" font-weight="700" font-size="14.5">Config.build</text>
<text x="274" y="102" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">new staging scope</text>
<text x="274" y="121" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">run file in new env</text>
<line x1="220" y1="100" x2="260" y2="100" stroke="#7982a9" stroke-width="1.8" marker-end="url(#a-dim)"/>
<rect x="520" y="30" width="200" height="70" rx="9" fill="#24283b" stroke="#f7768e" stroke-width="1.6"/>
<text x="534" y="54" fill="#f7768e" font-weight="700" font-size="14.5">error / syntax error</text>
<text x="534" y="76" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">keep OLD scope</text>
<text x="534" y="95" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">report in THIS editor</text>
<rect x="520" y="118" width="200" height="70" rx="9" fill="#24283b" stroke="#9ece6a" stroke-width="1.6"/>
<text x="534" y="142" fill="#9ece6a" font-weight="700" font-size="14.5">ok</text>
<text x="534" y="164" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">swap scope atomically</text>
<text x="534" y="183" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">refresh_options()</text>
<line x1="480" y1="80" x2="520" y2="66" stroke="#f7768e" stroke-width="1.8" marker-end="url(#a-red)"/>
<line x1="480" y1="120" x2="520" y2="150" stroke="#9ece6a" stroke-width="1.8" marker-end="url(#a-green)"/>
<rect x="760" y="56" width="200" height="132" rx="9" fill="#24283b" stroke="#e0af68" stroke-width="1.6"/>
<text x="774" y="80" fill="#e0af68" font-weight="700" font-size="14.5">untouched</text>
<text x="774" y="102" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">buffers + undo</text>
<text x="774" y="121" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">cursor, registers</text>
<text x="774" y="140" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">children, parent</text>
<text x="774" y="159" fill="#c0caf5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">OTHER editors</text>
<line x1="720" y1="153" x2="760" y2="130" stroke="#7982a9" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-dim)"/>
<rect x="20" y="216" width="940" height="96" rx="9" fill="#24283b" stroke="#24283b" stroke-width="1.6"/>
<text x="34" y="240" fill="#24283b" font-weight="700" font-size="14.5">Guarantees (each one is a test)</text>
<text x="34" y="262" fill="#c0caf5" font-size="13">No duplicated mappings (scope replaced wholesale) · removed options revert to defaults</text>
<text x="34" y="281" fill="#c0caf5" font-size="13">Half-applied configs are discarded: `vim.opt.number = true; error(&#x27;late&#x27;)` leaves number unchanged</text>
<text x="34" y="300" fill="#c0caf5" font-size="13">A broken child config never takes down its parent</text>
</svg>
