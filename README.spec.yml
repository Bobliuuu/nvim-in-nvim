  - {path: tests/, desc: "Lua specs, pty end-to-end tests and run.sh"}
  - {path: experiments/, desc: "phase-0 input interception research"}
  - {path: tools/, desc: "screenshots/diagrams, record_tests.py and readme_data.py"}
