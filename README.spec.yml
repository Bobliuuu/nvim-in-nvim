intro: |
  <a id="video"></a>
  A Vim-like editor written in about {{ n.lua_lines.text }} lines of Lua ({{ n.lua_files.text }} modules), running **on top of** Neovim using nothing but its public API, with its own `init.lua`
  configuration system. The editors are *logical* editors, not extra processes: each has its own modes, cursor, registers, undo, buffers, mappings and
  **its own Lua environment in which `vim` means "this editor"**. So an editor built from Neovim configuration can edit the configuration of another editor built from Neovim configuration.

  <p align="center"><img src="docs/img/nested.svg" alt="Four nested editors A, B, C, D in a single Neovim process" width="860"></p>

video:
  url: ""
  caption: "Explainer video (voice-over and captions): the idea, the architecture, the tests, the limits"
  mp4: video/nvim_in_nvim_explainer.mp4
  gif: video/preview.gif
  srt: video/nvim_in_nvim_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: nvim-in-nvim
      subtitle: Neovim inside Neovim inside Neovim
      chips: [Lua only, zero plugins, own init.lua]
      say: "nvim in nvim: Neovim inside Neovim inside Neovim. A Vim like editor written in Lua, that runs on top of Neovim, and has its own configuration system."
    - type: problem
      heading: "The question"
      bullets:
        - "Can Neovim's config system express a smaller Neovim?"
        - "One that has its own config system, and can edit another one's config?"
        - "Using only the public API, no plugins, no extra processes"
      say: "Can Neovim's configuration system express a smaller Neovim, one that has a configuration system of its own, and can edit the configuration of another editor like itself? And can it do that using only the public A P I, no plugins and no extra processes?"
    - type: code
      heading: "Four editors, one process"
      code: |
        REAL NEOVIM  loads our init.lua
          EDITOR A  configs/a/init.lua
            EDITOR B  configs/b/init.lua
              EDITOR C  configs/c/init.lua
                EDITOR D  configs/d/init.lua
      say: "Real Neovim loads one init dot lua, which boots editor A. A spawns B, B spawns C, and C spawns D. They are not Neovim processes. Each is a logical editor implemented in Lua, with its own modes, registers, undo history, key mappings, and its own Lua environment where the word vim means this editor."
    - type: architecture
      diagram: flow
      heading: "How a key travels"
      say: "Neovim gives us three primitives: a key arriving, a buffer, and a float window. One on key hook swallows every key and routes it to the focused editor. Each editor holds its own state, and one render module draws each editor as a float. Because a child editor needs the same three primitives, an editor can host another editor."
    - type: stat
      number: lua_lines
      kicker: "lines of Lua in {{ n.lua_files.text }} modules"
      label: "lines"
      sub: "zero third-party plugins, zero extra Neovim processes"
      say: "The whole editor is {{ n.lua_lines.numtext }} lines of Lua across {{ n.lua_files.numtext }} modules, with no third party plugins."
    - type: chart
      chart: modules
      say: "Most of the logic sits in the editor core, the config loader, the mode state machine, motions and rendering. Operators and motions know nothing about each other, so adding one motion gives you delete, change, yank and visual support for it."
    - type: table
      table: tests_tbl
      heading: "Tests"
      say: "The tests have four layers. {{ n.specs.numtext }} Lua specs run in headless Neovim. {{ n.e2e.numtext }} of {{ n.e2e_of.numtext }} end to end checks drive the real terminal U I in a pseudo terminal with raw bytes, including the full story where editor B edits and saves C's config, and C reloads it. And {{ n.research.numtext }} input research assertions back the design. All {{ n.t_pass.numtext }} pass."
    - type: caveats
      heading: "Honest limitations"
      bullets:
        - "Configs are trusted code; isolation covers names and state, not capabilities"
        - "Not Vim: no regex search, folds, marks, macros or :s"
        - "Undo is linear whole-buffer snapshots"
        - "One physical terminal, so cursor shape is global"
      say: "The limits. Configs are trusted code: a private Lua environment isolates names and state, not capabilities. This is not full Vim: there is no regex search, folds, marks or macros, and undo is a linear snapshot. There is one physical terminal, so cursor shape is global."
    - type: end
      title: nvim-in-nvim
      subtitle: "Try it: nvim -u ./init.lua"
      say: "Clone the repo, and run nvim dash u dot slash init dot lua to try it."

