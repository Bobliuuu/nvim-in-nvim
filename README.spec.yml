    title: "One input hook, many logical editors"
    nodes:
      - {id: k, label: "Key arrives", sub: "vim.on_key returns '' so native Vim never runs", col: 0, row: 0, kind: io}
      - {id: r, label: "Router", sub: "Instances.focused, one pointer", col: 1, row: 0, kind: accent}
